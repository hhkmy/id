<section class="flex items-center justify-between px-4 py-2">
  <div class="antialiased">
    {{ range .Site.Data.about.qualifications }}
      <ul class="list-outside list-disc">
        <li class="py-1"><h2>{{ .year }} — {{ .name }}</h2></li>
      </ul>
      <div class="font-light text-gray-500 py-1">
        <i class="fa-light fa-certificate mr-1"></i>
        {{ .location }}
        ➻
        {{ .training }}
      </div>
    {{ end }}
  </div>
</section>
