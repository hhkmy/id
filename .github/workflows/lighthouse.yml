name: Update Lighthouse Scores

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Update Lighthouse data
        run: npm run lighthouse:pages

      - name: Commit updated Lighthouse data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Lighthouse scores"
          file_pattern: data/lighthouse.json
