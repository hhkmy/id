name: Hugo (cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install Latest Hugo Extended
      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      # Install Latest Dart Sass
      - name: Install Dart Sass
        run: |
          echo "Installing latest Dart Sass..."
          LATEST_SASS=$(curl -s https://api.github.com/repos/sass/dart-sass/releases/latest | grep "tag_name" | cut -d'"' -f4)
          echo "Latest version: $LATEST_SASS"
          wget https://github.com/sass/dart-sass/releases/download/${LATEST_SASS}/dart-sass-${LATEST_SASS#v}-linux-x64.tar.gz
          tar -xzf dart-sass-*.tar.gz
          sudo mv dart-sass/sass /usr/local/bin/
          sudo chmod +x /usr/local/bin/sass
          sass --version

      # Install Latest Node.js LTS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts"

      # Build with latest versions
      - name: Build Hugo
        env:
          HUGO_ENV: production
        run: |
          echo "Hugo version: $(hugo version)"
          echo "Node version: $(node --version)"
          echo "Sass version: $(sass --version)"
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
