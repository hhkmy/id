name: FOSSA

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".fossa.yml"
      - ".github/workflows/fossa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".fossa.yml"
      - ".github/workflows/fossa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run FOSSA scan
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: Run FOSSA test
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
