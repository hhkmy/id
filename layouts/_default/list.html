{{ define "main" }}
	<main>
		<article>
			<header><h1>{{ .Title }}</h1></header>
			{{ .Content }}
		</article>
		<ul>
			<!-- Add pagination and limit to 20 items/page -->
			{{ $paginator := .Paginate (.Pages.ByDate.Reverse) 20 }}
			{{ range $paginator.Pages }}
				<li>
					<a href="{{ .Permalink }}">
						<!-- Pre-compute date format -->
						{{ .Date.Format "2006-01-02" }} |
						{{ .Title }}
					</a>
				</li>
			{{ end }}
		</ul>
	</main>
{{ end }}
