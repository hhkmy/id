<nav class="sticky top-0 z-50 mb-4">
	<div class="container mx-auto px-1 py-2 flex items-center justify-between">
		<!-- Logo & Site Title -->
		<a href="{{ .Site.Home.RelPermalink }}" class="flex items-center gap-3 group focus:outline-none">
			<picture>
				<img
					src="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
					id="qr-image"
					alt="HHK Logo"
					title="{{ site.Title }}"
					class="h-9 w-9 group-hover:scale-105 transition-transform duration-150"
					onmousedown="return false"
					data-light="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
					data-dark="{{ (resources.Get "ui/qr-dark.svg").RelPermalink }}"
				>
			</picture>
			<span class="hidden sm:inline text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">{{ site.Title }}</span>
		</a>

		<!-- Navigation & Theme Switcher -->
		<div class="flex items-center gap-3">
			{{ partial "menu.html" (dict "menuID" "main" "page" .) }}
			<div class="flex gap-1">
				<button
					id="theme-toggle-dark"
					aria-label="Switch to dark mode"
					class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 focus:outline-none transition-colors"
					title="Dark mode"
				>
					<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-700 dark:text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
					</svg>
				</button>
				<button
					id="theme-toggle-light"
					aria-label="Switch to light mode"
					class="p-2 rounded-full hover:bg-yellow-100 dark:hover:bg-yellow-600 focus:outline-none transition-colors"
					title="Light mode"
				>
					<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-yellow-500 dark:text-yellow-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M6.05 17.95l-1.414 1.414M17.95 17.95l-1.414-1.414M6.05 6.05L4.636 7.464"
						/>
					</svg>
				</button>
			</div>
		</div>
	</div>
</nav>
