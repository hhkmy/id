<nav class="block py-2 mx-auto">
	<div class="container flex flex-wrap items-center justify-between mx-auto text-slate-800">
		<div class="flex items-center">
			<a href="{{ .Site.Home.RelPermalink }}" class="flex items-center group py-1.5 text-base text-slate-800 font-semibold">
				<picture>
					<img
						src="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
						id="qr-image"
						alt="HHK"
						title="{{ site.Title }}"
						class="h-8 w-8 mr-2 group-hover:scale-105 transition-transform"
						onmousedown="return false"
						data-light="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
						data-dark="{{ (resources.Get "ui/qr-dark.svg").RelPermalink }}"
					>
				</picture>
				<span class="hidden sm:inline">{{ site.Title }}</span>
			</a>
		</div>

		<!-- Minimal theme switcher: icon-only, flat, subtle hover -->
		<div class="flex items-center ml-4 gap-2">
			{{ partial "menu.html" (dict "menuID" "main" "page" .) }}
			<button id="theme-toggle-dark" class="p-1 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="Switch to dark mode">
				<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-700 dark:text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
				</svg>
			</button>
			<button id="theme-toggle-light" class="p-1 rounded-full hover:bg-yellow-100 dark:hover:bg-yellow-600 transition-colors" title="Switch to light mode">
				<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-yellow-500 dark:text-yellow-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M6.05 17.95l-1.414 1.414M17.95 17.95l-1.414-1.414M6.05 6.05L4.636 7.464"
					/>
				</svg>
			</button>
		</div>
	</div>
</nav>
