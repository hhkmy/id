<nav class="sticky top-0 z-50 mb-8 border-b border-slate-200/80 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
	<div class="site-shell flex items-center justify-between py-3">
		<!-- Logo & Site Title -->
		<div class="flex items-center gap-3">
			<button
				id="qr-image-trigger"
				type="button"
				class="group rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
				aria-haspopup="dialog"
				aria-controls="qr-modal"
				aria-label="Open QR code"
			>
				<img
					id="qr-image"
					class="pointer-events-none h-10 w-10 rounded-md ring-1 ring-slate-200 dark:invert dark:ring-slate-800"
					src="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
					width="40"
					height="40"
					alt=""
					onmousedown="return false"
				>
			</button>
			<a
				href="{{ .Site.Home.RelPermalink }}"
				class="hidden text-lg font-bold tracking-tight text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 dark:text-slate-100 sm:inline"
				>{{ site.Title }}</a
			>
		</div>

		<!-- Navigation & Theme Switcher -->
		<div class="flex items-center gap-2 sm:gap-3">
			{{ partial "menu.html" (dict "menuID" "main" "page" .) }}
			<button id="site-search-trigger" type="button" class="nav-search-trigger" aria-label="Search" title="Search">
				<svg aria-hidden="true" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m1.1-5.4a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
				</svg>
				<span class="hidden sm:inline">Search</span>
			</button>
			<div class="flex gap-1">
				<button
					id="theme-toggle-dark"
					aria-label="Switch to dark mode"
					class="rounded-md p-2 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 dark:hover:bg-slate-800"
					title="Dark mode"
				>
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700 dark:text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
					</svg>
				</button>
				<button
					id="theme-toggle-light"
					aria-label="Switch to light mode"
					class="rounded-md p-2 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 dark:hover:bg-slate-800"
					title="Light mode"
				>
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-500 dark:text-yellow-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M6.05 17.95l-1.414 1.414M17.95 17.95l-1.414-1.414M6.05 6.05L4.636 7.464"
						/>
					</svg>
				</button>
			</div>
		</div>
	</div>
</nav>

<div
	id="qr-modal"
	class="fixed inset-0 z-100 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm"
	role="dialog"
	aria-modal="true"
	aria-labelledby="qr-modal-title"
	tabindex="-1"
>
	<div class="relative rounded-lg bg-white p-4 shadow-2xl ring-1 ring-slate-200 dark:bg-slate-950 dark:ring-slate-800">
		<h2 id="qr-modal-title" class="sr-only">QR code</h2>
		<img
			id="qr-modal-image"
			class="h-auto max-h-[min(80dvh,48rem)] w-full max-w-[min(88vw,48rem)] rounded-md dark:invert"
			data-src="{{ (resources.Get "ui/qr.svg").RelPermalink }}"
			width="1024"
			height="1024"
			alt="HHK QR code"
		>
	</div>
</div>
