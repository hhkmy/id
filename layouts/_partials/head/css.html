{{ with resources.Get "css/main.css" }}
	{{ $opts := dict "minify" (not hugo.IsDevelopment) }}
	{{ with . | css.TailwindCSS $opts }}
		{{ if hugo.IsDevelopment }}
			<link rel="preload" href="{{ .RelPermalink }}" as="style" />
			<link rel="stylesheet" href="{{ .RelPermalink }}" />
		{{ else }}
			{{ with resources.Fingerprint . }}
				<link rel="preload" href="{{ .RelPermalink }}" as="style" crossorigin="anonymous" />
				<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" fetchpriority="high" />
			{{ end }}
		{{ end }}
	{{ end }}
{{ end }}
