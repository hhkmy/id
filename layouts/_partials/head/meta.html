<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<link rel="icon" href="{{ (resources.Get "ui/favicon.ico").RelPermalink }}" type="image/x-icon">
<link rel="apple-touch-icon" href="{{ (resources.Get "ui/apple-touch-icon.png").RelPermalink }}" sizes="180x180">
<link rel="icon" type="image/png" href="{{ (resources.Get "ui/favicon-32x32.png").RelPermalink }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ (resources.Get "ui/favicon-16x16.png").RelPermalink }}" sizes="16x16">
<link rel="manifest" href="{{ (resources.Get "ui/site.webmanifest").RelPermalink }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} RSS Feed" href="{{ .Site.BaseURL }}index.xml">
<link rel="alternate" type="application/atom+xml" title="{{ .Site.Title }} Atom Feed" href="{{ .Site.BaseURL }}index.xml">
<link rel="alternate" type="application/json" title="{{ .Site.Title }} JSON Feed" href="{{ .Site.BaseURL }}index.json">
<link rel="alternate" type="application/ld+json" href="{{ .Site.BaseURL }}index.json">
<meta name="description" content="{{ .Site.Params.description }}">
<meta name="keywords" content="{{ .Site.Params.keywords }}">
<meta name="author" content="{{ .Site.Params.author }}">
<meta name="theme-color" content="#ffffff">
<meta property="og:image" content="{{ (resources.Get "ui/og-image.png").RelPermalink }}">
<meta property="og:image:alt" content="{{ .Site.Title }} - {{ .Site.Params.description }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.description }}">

			"https://www.facebook.com/100008954538831"
		],
		"jobTitle": "Founder",
		"worksFor": {
			"@type": "Organization",
			"name": "Myanmar Kali Linux Organization"
		}
	}
</script>
