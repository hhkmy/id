<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<link rel="icon" href="{{ (resources.Get "ui/favicon.ico").RelPermalink }}" type="image/x-icon">
<link rel="apple-touch-icon" href="{{ (resources.Get "ui/apple-touch-icon.png").RelPermalink }}" sizes="180x180">
<link rel="icon" type="image/png" href="{{ (resources.Get "ui/favicon-32x32.png").RelPermalink }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ (resources.Get "ui/favicon-16x16.png").RelPermalink }}" sizes="16x16">
<link rel="manifest" href="{{ (resources.Get "ui/site.webmanifest").RelPermalink }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} RSS Feed" href="{{ .Site.BaseURL }}index.xml">
<link rel="alternate" type="application/atom+xml" title="{{ .Site.Title }} Atom Feed" href="{{ .Site.BaseURL }}index.xml">
<link rel="alternate" type="application/json" title="{{ .Site.Title }} JSON Feed" href="{{ .Site.BaseURL }}index.json">
<link rel="alternate" type="application/ld+json" href="{{ .Site.BaseURL }}index.json">

<meta name="description" content="{{ .Site.Params.description | default "Explore Hein Htet Kyaw’s insightful blogs and stay tuned for upcoming video tutorials." }}">
<meta name="keywords" content="{{ .Site.Params.keywords | default "your, keywords, here" }}">
<meta name="author" content="{{ .Site.Params.author | default "Hein Htet Kyaw" }}">
<meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta
	property="og:description"
	content="{{ .Site.Params.description | default "Explore Hein Htet Kyaw’s insightful blogs and stay tuned for upcoming video tutorials." }}"
>
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta
	name="twitter:description"
	content="{{ .Site.Params.description | default "Explore Hein Htet Kyaw’s insightful blogs and stay tuned for upcoming video tutorials." }}"
>
<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "Person",
		"name": "Hein Htet Kyaw",
		"url": "https://hhk.my.id",
		"sameAs": [
			"https://linkedin.com/in/h2kyaw",
			"https://github.com/h2kyaw",
			"https://twitter.com/HeinHtetKyaw_",
			"https://www.facebook.com/callmeHeinHtetKyaw",
			"https://www.facebook.com/100008954538831"
		],
		"jobTitle": "Founder",
		"worksFor": {
			"@type": "Organization",
			"name": "Myanmar Kali Linux Organization"
		}
	}
</script>
