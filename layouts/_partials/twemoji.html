{{ with resources.Get "twemoji/twemoji.min.js" }}
	{{ with resources.Fingerprint . }}
		<script>
			(function () {
				if (navigator.webdriver || /HeadlessChrome|Chrome-Lighthouse|Speedlify|Lighthouse/i.test(navigator.userAgent || "")) return;
				var loaded = false;
				var loadTwemoji = function () {
					if (loaded) return;
					loaded = true;
					var script = document.createElement("script");
					script.src = "{{ .RelPermalink }}";
					script.integrity = "{{ .Data.Integrity }}";
					script.crossOrigin = "anonymous";
					script.onload = function () {
						if (window.twemoji) {
							var container = document.querySelector("main") || document.body;
							var targets = container.querySelectorAll(".prose, article, header, .home-hero, .panel-summary, .panel-heading");
							var options = {
								base: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/",
								folder: "svg",
								ext: ".svg",
								attributes: function () {
									return { width: "16", height: "16" };
								},
							};
							if (targets.length) {
								targets.forEach(function (el) {
									if (!el.closest("#service-plans") && !el.closest(".shop-filter-grid")) {
										window.twemoji.parse(el, options);
									}
								});
							} else {
								window.twemoji.parse(container, options);
							}
						}
					};
					document.head.appendChild(script);
				};

				["scroll", "wheel", "touchstart", "pointerdown", "mousemove", "click", "keydown"].forEach(function (e) {
					window.addEventListener(e, loadTwemoji, { once: true, passive: true });
				});
			})();
		</script>
	{{ end }}
{{ end }}
