<div class="article-comments">
	<h2>Comments</h2>
	<div id="remark42">Comments loading...</div>
	<script>
		window.remark_config = {
			host: "https://comments.hhk.my.id",
			site_id: "remark",
			theme: document.documentElement.classList.contains("dark") ? "dark" : "light",
			components: ["embed"],
			no_footer: true,
		};

		(function () {
			var loaded = false;
			function loadRemark() {
				if (loaded) return;
				loaded = true;
				var doc = document;
				var target = doc.head || doc.body;
				var components = window.remark_config.components || ["embed"];
				for (const component of components) {
					var script = doc.createElement("script");
					var ext = ".js";
					if ("noModule" in script) {
						script.type = "module";
						ext = ".mjs";
					} else {
						script.async = true;
					}
					script.defer = true;
					script.src = window.remark_config.host + "/web/" + component + ext;
					target.appendChild(script);
				}
			}

			var container = document.getElementById("remark42");
			if (!container) return;

			if ("IntersectionObserver" in window) {
				var observer = new IntersectionObserver(
					function (entries) {
						if (entries[0].isIntersecting) {
							observer.disconnect();
							loadRemark();
						}
					},
					{rootMargin: "300px"},
				);
				observer.observe(container);
			} else {
				loadRemark();
			}
		})();
	</script>
</div>
