{{- $token := site.Params.cloudflare.analyticsToken -}}
{{- if and $token (not hugo.IsDevelopment) -}}
	<script data-cf-beacon-token="{{ $token }}">
		(function () {
			if (navigator.webdriver || /HeadlessChrome|Chrome-Lighthouse|Speedlify|Lighthouse/i.test(navigator.userAgent || "")) return;
			var currentScript = document.currentScript;
			var token = currentScript && currentScript.dataset ? currentScript.dataset.cfBeaconToken || "" : "";
			if (!token) return;
			var loaded = false;
			function loadCFBeacon() {
				if (loaded) return;
				loaded = true;
				var script = document.createElement("script");
				script.src = "https://static.cloudflareinsights.com/beacon.min.js";
				script.dataset.cfBeacon = JSON.stringify({token: token});
				script.defer = true;
				document.body.appendChild(script);
			}
			["scroll", "wheel", "touchstart", "pointerdown", "mousemove", "click", "keydown"].forEach(function (e) {
				window.addEventListener(e, loadCFBeacon, {once: true, passive: true});
			});
		})();
	</script>
{{- end -}}
