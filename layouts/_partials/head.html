<meta charset="utf-8">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s - %s" .Title site.Title }}{{ end }}</title>
{{ partialCached "head/meta.html" . .Permalink }}
<script>
	// Immediately check for dark mode preference
	if (localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
		document.documentElement.classList.add("dark");
		document.documentElement.setAttribute("data-pf-theme", "dark");
	} else {
		document.documentElement.classList.remove("dark");
		document.documentElement.removeAttribute("data-pf-theme");
	}
</script>
{{ partialCached "head/css.html" . hugo.IsDevelopment }}
<link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-component-ui.js" type="module"></script>
{{ partialCached "head/js.html" . }}
