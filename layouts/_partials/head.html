<meta charset="utf-8">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s - %s" .Title site.Title }}{{ end }}</title>
{{ partialCached "head/meta.html" . .Permalink }}
<script>
	(function () {
		var storedTheme = null;
		try {
			storedTheme = localStorage.getItem("theme");
		} catch (error) {}

		if (storedTheme === "dark" || (!storedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
			document.documentElement.classList.add("dark");
			document.documentElement.setAttribute("data-pf-theme", "dark");
			return;
		}

		document.documentElement.classList.remove("dark");
		document.documentElement.removeAttribute("data-pf-theme");
	})();
</script>
{{ partialCached "head/css.html" . hugo.IsDevelopment }}
{{ partial "head/katex.html" . }}
{{ partialCached "head/pagefind.html" . hugo.IsDevelopment }}
{{ partialCached "head/js.html" . }}
