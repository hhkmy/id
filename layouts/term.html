{{ define "main" }}
	<section class="px-2">
		<header class="mb-8 flex flex-col items-center">
			<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">{{ .Title }}</h1>
			{{ with .Content }}
				<div class="text-base text-gray-600 dark:text-gray-300 text-center max-w-2xl">{{ . }}</div>
			{{ end }}
		</header>

		{{ if .Pages }}
			<ul class="flex flex-col gap-0.5">
				{{ range .Pages }}
					<li class="py-3 border-b border-gray-100 dark:border-slate-800">
						<a href="{{ .RelPermalink }}" class="text-lg font-semibold text-blue-700 dark:text-blue-300">
							{{ .LinkTitle }}
						</a>
						{{ if .Date }}
							<span class="text-xs text-gray-400 ml-2">{{ .Date.Format "Jan 2, 2006" }}</span>
						{{ end }}
						{{ with .Summary }}
							<div class="text-gray-500 dark:text-gray-400 text-sm mt-1">{{ . }}</div>
						{{ end }}
					</li>
				{{ end }}
			</ul>
		{{ end }}
	</section>
{{ end }}
