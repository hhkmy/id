{{ define "main" }}
	<article class="w-full">
		<header class="border-b border-slate-200 py-12 dark:border-slate-800">
			<p class="section-title">Site information</p>
			<h1 class="mt-2 text-5xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-6xl">{{ .Title }}</h1>
			{{ with .Description }}
				<p class="mt-5 max-w-4xl text-lg leading-8 text-slate-600 dark:text-slate-300">{{ . }}</p>
			{{ end }}
			{{ with .Lastmod }}
				<p class="mt-5 text-sm text-slate-500 dark:text-slate-400">
					Last updated <time datetime="{{ .Format `2006-01-02T15:04:05-07:00` }}">{{ .Format "January 2, 2006" }}</time>
				</p>
			{{ end }}
		</header>

		<div class="article-content prose max-w-none py-10 text-slate-700 dark:text-slate-200">
			{{ .Content }}
		</div>
	</article>
{{ end }}
