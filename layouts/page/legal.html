{{ define "main" }}
	<article class="w-full">
		<header class="legal-header">
			<p class="section-title">Site information</p>
			<h1 class="legal-title">{{ .Title }}</h1>
			{{ with .Description }}
				<p class="legal-description">{{ . }}</p>
			{{ end }}
			{{ with .Lastmod }}
				<p class="legal-updated">
					Last updated <time datetime="{{ .Format `2006-01-02T15:04:05-07:00` }}">{{ .Format "January 2, 2006" }}</time>
				</p>
			{{ end }}
		</header>

		<div class="article-content prose max-w-none py-10">
			{{ .Content }}
		</div>
	</article>
{{ end }}
