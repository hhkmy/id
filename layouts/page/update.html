{{ define "main" }}
	<section class="min-h-[70vh] w-full space-y-10">
		<header class="grid gap-8 border-b border-slate-200 py-12 dark:border-slate-800 lg:grid-cols-[minmax(0,1.5fr)_minmax(280px,0.65fr)] lg:items-end">
			<div>
				<p class="section-title">Changelog</p>
				<h1 class="mt-2 text-5xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-6xl">Latest updates</h1>
				<p class="mt-5 max-w-3xl text-lg leading-8 text-slate-600 dark:text-slate-300">
					Recent changes, improvements, and fixes published to this website from the
					<a class="font-semibold text-slate-950 underline dark:text-white" href="https://github.com/hhkmy/id">hhkmy/id</a> repository.
				</p>
			</div>
			<div class="rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-950">
				<p class="section-title">Repository</p>
				<div class="mt-3 space-y-3 text-sm">
					<dl class="flex items-center justify-between gap-4">
						<dt class="text-slate-500 dark:text-slate-400">Project</dt>
						<dd class="font-semibold text-slate-950 dark:text-white">hhkmy/id</dd>
					</dl>
					<dl class="flex items-center justify-between gap-4">
						<dt class="text-slate-500 dark:text-slate-400">Branch</dt>
						<dd class="font-mono text-slate-950 dark:text-white">main</dd>
					</dl>
					<dl class="flex items-center justify-between gap-4">
						<dt class="text-slate-500 dark:text-slate-400">Source</dt>
						<dd class="font-semibold text-slate-950 dark:text-white">GitHub</dd>
					</dl>
				</div>
			</div>
		</header>

		<section class="pb-8" aria-labelledby="github-updates-title">
			<div class="flex flex-col justify-between gap-3 border-b border-slate-200 pb-5 dark:border-slate-800 sm:flex-row sm:items-end">
				<div>
					<p class="section-title">GitHub activity</p>
					<h2 id="github-updates-title" class="mt-1 text-2xl font-bold tracking-tight text-slate-950 dark:text-white">Latest commits</h2>
				</div>
				<a
					class="text-sm font-semibold text-slate-600 hover:text-slate-950 dark:text-slate-300 dark:hover:text-white"
					href="https://github.com/hhkmy/id/commits/main"
				>
					View all on GitHub
				</a>
			</div>

			<div
				id="github-updates"
				class="mt-2"
				data-endpoint="https://api.github.com/repos/hhkmy/id/commits?sha=main&amp;per_page=20"
				aria-live="polite"
				aria-busy="true"
			>
				<p class="github-updates-status">Loading the latest commits…</p>
			</div>
		</section>
	</section>
{{ end }}
