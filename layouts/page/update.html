{{ define "main" }}
	<section class="min-h-[70vh] w-full space-y-10">
		<header class="update-hero">
			<div>
				<p class="section-title">Changelog</p>
				<h1 class="update-title">Latest updates</h1>
				<p class="update-summary">
					Recent changes, improvements, and fixes published to this website from the
					<a class="update-repo-link" href="https://github.com/hhkmy/id">hhkmy/id</a> repository.
				</p>
			</div>
			<div class="update-card">
				<p class="section-title">Repository</p>
				<div class="mt-3 space-y-3 text-sm">
					<dl class="flex items-center justify-between gap-4">
						<dt class="update-card-label">Project</dt>
						<dd class="update-card-value font-semibold">hhkmy/id</dd>
					</dl>
					<dl class="flex items-center justify-between gap-4">
						<dt class="update-card-label">Branch</dt>
						<dd class="update-card-value font-mono">main</dd>
					</dl>
					<dl class="flex items-center justify-between gap-4">
						<dt class="update-card-label">Source</dt>
						<dd class="update-card-value font-semibold">GitHub</dd>
					</dl>
				</div>
			</div>
		</header>

		<section class="pb-8" aria-labelledby="github-updates-title">
			<div class="update-section-header">
				<div>
					<p class="section-title">GitHub activity</p>
					<h2 id="github-updates-title" class="panel-heading">Latest commits</h2>
				</div>
				<a
					class="update-github-link"
					href="https://github.com/hhkmy/id/commits/main"
				>
					View all on GitHub
				</a>
			</div>

			<div
				id="github-updates"
				class="mt-6"
				data-endpoint="https://api.github.com/repos/hhkmy/id/commits?sha=main&amp;per_page=20"
				aria-live="polite"
				aria-busy="true"
			>
				<p class="github-updates-status">Loading the latest commits…</p>
			</div>
		</section>
	</section>
{{ end }}
