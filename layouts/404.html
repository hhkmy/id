{{ define "main" }}
	<div class="min-h-screen flex flex-col items-center justify-center">
		<div class="flex flex-col items-center">
			<svg class="not-found-icon w-20 h-20 text-red-400 dark:text-red-300 mb-6" fill="none" viewBox="0 0 64 64" aria-hidden="true">
				<circle cx="32" cy="32" r="28" stroke="#f87171" stroke-width="4" :fill="'var(--tw-bg-opacity,1) #fee2e2'" fill="#fee2e2" />
				<rect x="29" y="18" width="6" height="22" rx="3" fill="#f87171" />
				<rect x="29" y="44" width="6" height="6" rx="3" fill="#f87171" />
			</svg>
			<h1 class="text-4xl font-extrabold text-indigo-700 dark:text-indigo-400 mb-2">404</h1>
			<h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Page Not Found</h2>
			<p class="text-gray-500 dark:text-gray-400 mb-6 text-center">Sorry, the page you are looking for does not exist, was moved, or the URL is incorrect.</p>
			<a
				href="{{ .Site.Home.RelPermalink }}"
				class="inline-block px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 dark:bg-indigo-700 dark:hover:bg-indigo-800"
				>Return to Home</a
			>
		</div>
	</div>
{{ end }}
