{{ define "main" }}
	<div class="not-found-container">
		<div class="not-found-content">
			<svg class="not-found-icon" fill="none" viewBox="0 0 64 64" aria-hidden="true">
				<circle cx="32" cy="32" r="28" stroke="#f87171" stroke-width="4" fill="#fee2e2" />
				<rect x="29" y="18" width="6" height="22" rx="3" fill="#f87171" />
				<rect x="29" y="44" width="6" height="6" rx="3" fill="#f87171" />
			</svg>
			<h1 class="not-found-code">404</h1>
			<h2 class="not-found-title">Page Not Found</h2>
			<p class="not-found-message">Sorry, the page you are looking for does not exist, was moved, or the URL is incorrect.</p>
			<a
				href="{{ .Site.Home.RelPermalink }}"
				class="link-button"
				>Return to Home</a
			>
		</div>
	</div>
{{ end }}
