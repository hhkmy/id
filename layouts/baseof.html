<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
	<head>
		{{ partial "head.html" . }}
	</head>
	<body>
		<header>{{ partialCached "header.html" . (or .Section .RelPermalink) }}</header>
		<main class="site-shell" data-pagefind-body>{{ block "main" . }}{{ end }}</main>
		{{ partialCached "footer.html" . now.Year }}
		{{ partialCached "scroll-to-top.html" . }}
		{{ partialCached "twemoji.html" . }}
	</body>
</html>
