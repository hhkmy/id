<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">

		{{ partial "head.html" . }}
	</head>
	<body>
		<header>{{ partial "header.html" . }}</header>
		<main class="site-shell" data-pagefind-body>{{ block "main" . }}{{ end }}</main>
		{{ partialCached "footer.html" . now.Year }}
	</body>
</html>
