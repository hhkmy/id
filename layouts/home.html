{{ define "main" }}
	{{ .Content }}


	<div id="post-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 justify-center mt-6">
		{{ range $i, $p := where site.RegularPages "Section" "posts" }}
			<div
				class="post-card relative bg-gradient-to-br from-blue-50 via-white to-blue-100 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-3 flex flex-col mb-2 border border-gray-100 dark:border-slate-800 group overflow-hidden scale-100 hover:scale-100 hover:-translate-y-1 hover:border-blue-300 hover:ring-2 hover:ring-blue-100/40 dark:hover:ring-blue-700/20"
			>
				<div class="relative z-10 p-0 flex flex-col h-full">
					<span
						class="absolute right-3 top-3 w-8 h-8 bg-blue-100 dark:bg-blue-900 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-all duration-300"
					></span>
					<div class="flex items-center gap-1 mb-0.5">
						<span class="inline-block w-1.5 h-1.5 rounded-full bg-blue-200 animate-pulse"></span>
						<span class="text-[10px] text-gray-400 dark:text-gray-500 font-mono tracking-wide">{{ (time $p.Date).Format "Jan 2, 2006" }}</span>
					</div>
					<h2
						class="text-base font-bold mb-1 tracking-tight text-blue-800 dark:text-blue-200 drop-shadow-sm hover:text-blue-600 dark:hover:text-blue-300 transition-colors duration-200"
					>
						<a href="{{ $p.RelPermalink }}">{{ $p.LinkTitle }}</a>
					</h2>
					<div class="text-gray-700 dark:text-gray-200 text-sm flex-1 leading-relaxed line-clamp-2 mb-2 font-normal transition-all duration-200">
						{{ $p.Summary }}
					</div>
					<div class="flex items-center justify-between mt-auto">
						<a
							href="{{ $p.RelPermalink }}"
							class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold shadow-md hover:bg-blue-700 hover:scale-110 hover:shadow-xl transition-all duration-200 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300"
						>
							<span>Read More</span>
							<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
							</svg>
						</a>
						<div class="flex gap-0.5 flex-wrap">
							{{ with $p.Params.tags }}
								{{ range first 2 . }}
									<span
										class="inline-block px-1.5 py-0.5 rounded bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-200 text-[10px] font-medium border border-blue-100 dark:border-blue-800 mr-0.5 hover:bg-blue-200 hover:text-blue-900 transition-all duration-150"
										>#{{ . }}</span
									>
								{{ end }}
							{{ end }}
						</div>
					</div>
				</div>
			</div>
		{{ end }}
	</div>
{{ end }}
