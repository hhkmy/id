{{ define "main" }}
	<h1>{{ .Title }}</h1>
	{{ .Content }}


	<div class="archive-list">
		{{ range (where site.RegularPages "Type" "posts").GroupByDate "2006" }}
			<h2>{{ .Key }}</h2>
			{{ range .Pages }}
				<article class="archive-item">
					<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2" }}</time>
					<h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
					{{ if .Summary }}
						<p>{{ .Summary }}</p>
					{{ end }}
				</article>
			{{ end }}
		{{ end }}
	</div>
{{ end }}
