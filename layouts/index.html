{{ define "main" }}
	{{ $posts := where .Site.RegularPages "Type" "posts" | first 50 }}


	<div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="posts-container">
		{{ range $posts }}
			{{ .Render "title" }}
		{{ end }}
	</div>

	<!-- Load JS only if needed -->
	{{ $js := resources.Get "js/view-counter.js" | minify | fingerprint }}
	<script src="{{ $js.RelPermalink }}" defer></script>
{{ end }}
