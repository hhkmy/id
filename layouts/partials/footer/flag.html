{{ if .Site.Params.showVisitorLocation }}
	<div class="location" id="visitor">
		<span class="flag-icon flag-icon-unknown"></span>
		<span class="location-text">Loading location...</span>

		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const geoElement = document.getElementById("visitor");
				if (!geoElement) return;

				// Check if we're in development mode
				const isDevelopment = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

				if (isDevelopment) {
					// Development fallback (mock data)
					const mockLocations = [
						{country: "US", city: "New York"},
						{country: "GB", city: "London"},
						{country: "JP", city: "Tokyo"},
					];
					const mock = mockLocations[Math.floor(Math.random() * mockLocations.length)];
					updateLocation(mock.country, mock.city);
					return;
				}

				// Production - Cloudflare header detection
				fetch(window.location.href, {
					method: "HEAD",
					cache: "no-store",
					headers: {Accept: "text/html"},
				})
					.then((response) => {
						const country = response.headers.get("cf-ipcountry");
						if (!country) throw new Error("No Cloudflare geo headers");

						const city = response.headers.get("cf-ipcity");
						updateLocation(country, city);
					})
					.catch(() => {
						geoElement.style.display = "none";
					});

				function updateLocation(country, city) {
					geoElement.innerHTML = `
            Connected via
            <span class="location-text">${city ? city + ", " : ""}${country}</span>
            <span class="flag-icon flag-icon-${country.toLowerCase()}"></span>
          `;
				}
			});
		</script>
	</div>
{{ end }}
