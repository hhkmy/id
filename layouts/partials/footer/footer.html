<footer class="flex flex-col justify-center items-center my-3">
	<div class="inline-flex items-center justify-center w-full">
		<hr class="w-96 h-px my-8 bg-gray-300 border-0 rounded-sm dark:bg-gray-600">
		<div class="absolute px-4 -translate-x-1/2 bg-white left-1/2 dark:bg-gray-950"><i class="fa-light fa-shield-heart fa-beat"></i></div>
	</div>
	<div class="flex flex-col justify-center items-center">
		<speedlify-score speedlify-url="https://speedlify.hhk.my.id/" hash="2476f489"></speedlify-score>
		{{- partial "footer/social" . -}}
		<p class="title">
			<a class="text-semibold hover:text-gray-700 dark:hover:text-gray-300" href="{{ .Site.BaseURL }}previously" title="Previously on...">
				{{ index .Site.Data.seo.year }}
			</a>
			-
			<a class="text-semibold hover:text-gray-500" href="{{ .Site.BaseURL }}update" title="Current Updates">
				{{ now.Format "2006" }}
			</a>
			<span class="mx-2 text-xl">↭</span>
			<a href="{{ .Site.BaseURL }}" class="font-semibold hover:text-gray-500" aria-label="{{ .Site.Title }}">
				{{ .Site.Title }}
			</a>
		</p>
		<p class="powered">
			Powered By
			<a href="https://gohugo.io" class="text-semibold shover:text-gray-500">Hugo</a>
			↭
			<a href="https://stats.hhk.my.id" target="_blank"> <i class="fa-light fa-solid fa-heart-pulse fa-beat-fade"></i> Site Stats </a>
		</p>
		{{- partial "footer/flag" . -}}
		<p class="copyright">
			<i class="fa-light fa-thin fa-copyright"></i>
			{{ index .Site.Data.seo.license }}
			-
			<a class="text-semibold hover:text-gray-700 dark:hover:text-gray-300" href="{{ .Site.BaseURL }}whois" title="Previously on..."> whois</a>
		</p>
	</div>
</footer>
{{- partial "footer/scripts" . -}}
