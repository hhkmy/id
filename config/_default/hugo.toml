title = "HHK V/Blog"
baseURL = "https://hhk.my.id/"

languageCode = "my"
defaultContentLanguage = "my"

[Languages]
    [Languages.my]
    languageName = "Myanmar"
    weight = 1

canonifyURLs = true
disableHugoGeneratorInject = false
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
timeout = 1200

[taxonomies]
    tag = "tags"
    series = "series"
    author = "authors"
    category = "categories"

[params]
    author = "Hein Htet Kyaw"    
    
    authorbio = "Hein Htet Kyaw is a software engineer and blogger. He is passionate about technology, programming, and sharing knowledge with others. He enjoys writing about various topics, including web development, software engineering, and personal experiences."
    authoremail = "mr.kiddomonster@gmail.com"
    
    google_tag_manager = "G-MSGPDQQ4L7R"
    gtm = "GTM-TRZM5JG9"
    
    sitename = "HHK V/Blog"
    showVisitorLocation = true
    twitter = "@HeinHtetKyaw_"

    [params.ratingValue]
        value = 4.7
        count = 51

[params.fontawesome]
    v4shims = true 

[frontmatter]
    date = ['date', 'publishdate', 'pubdate', 'published', 'lastmod', 'modified']
    expiryDate = ['expirydate', 'unpublishdate']
    lastmod = [':git', 'lastmod', 'modified', 'date', 'publishdate', 'pubdate', 'published']
    publishDate = ['publishdate', 'pubdate', 'published', 'date']

[outputs]
    home = ["html", "rss", "SearchIndex"]
    page = ["html"]
    rss = ["rss"]
    section = ["html", "rss"]
    taxonomy = ["html", "rss"]
    term = ["html", "rss"]

[outputFormats]
    [outputFormats.SearchIndex]
        isPlainText = true
        notAlternative = true
        baseName = "searchindex"
        mediaType = "application/json"

[deployment]
    [[deployment.matchers]]
        cacheControl = "max-age=31536000, no-transform, public"
        gzip = true
        pattern = "^.+\\.(js|css|svg|ttf)$"
    [[deployment.matchers]]
        cacheControl = "max-age=31536000, no-transform, public"
        gzip = false
        pattern = "^.+\\.(png|jpg)$"
    [[deployment.matchers]]
        contentType = "application/xml"
        gzip = true
        pattern = "^sitemap\\.xml$"
    [[deployment.matchers]]
        gzip = true
        pattern = "^.+\\.(html|xml|json)$"